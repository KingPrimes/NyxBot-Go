# HTTP 服务器配置
server:
  # 监听端口
  port: "8080"
  # Gin 运行模式：debug / release / test
  gin_mode: release
  # 是否记录 HTTP 请求日志
  request_log: false
  # 信任的代理 IP 列表
  trusted_proxies: []

# SQLite 数据库配置
database:
  # 数据库文件路径
  path: data/nyxbot.db

# 日志系统配置
log:
  # 启动时是否打印初始化日志
  startup: true
  # 是否输出日志到控制台
  console: true
  # 日志文件目录
  dir: data/logs
  # 单个日志文件最大体积（MB），超出后轮转
  max_file_size_mb: 5
  # 日志文件保留天数
  max_age_days: 7
  # 内存中保留的历史日志条数
  history_size: 50

# OneBot 连接配置
bot:
  # 连接模式：server=反向 WS（等待 Bot 接入）/ client=正向 WS（主动连接 OneBot）
  mode: server
  # 反向 WS 挂载路径（mode=server 时生效）
  ws_server_path: /ws/shiro
  # 正向 WS 连接地址（mode=client 时生效）
  ws_client_url: ws://localhost:3001
  # OneBot 鉴权令牌
  access_token: ""
  # 反向 WS 并发等待数
  wait_n: 16
  # 是否使用艾特触发指令
  plugin_prefix: false
  # 当前选中的绘图插件名称
  plugin_name: ""

# 认证鉴权配置
auth:
  # JWT 签名密钥（首次启动时随机生成，请勿泄露）
  jwt_secret: acc8c22b522e9f7f6103adfacc3336f21dd067bb91d8f367c209bdf24d080d96

# Warframe 数据层配置
warframe:
  # 远程数据源请求重试次数（含首次，1=不重试）
  http_retry_attempts: 3
  # 首次重试等待秒数（指数退避基准）
  http_retry_base_wait_seconds: 1
  # 单次请求超时秒数
  http_retry_timeout_seconds: 15
