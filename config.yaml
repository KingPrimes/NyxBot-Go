server:
  host: "0.0.0.0"
  port: "8080"
  static_dir: "./resources/static"
  gin_mode: "release"
  request_log: false
  trusted_proxies: []

database:
  path: "data/nyxbot.db"

log:
  startup: true
  console: true
  dir: "data/logs"
  max_file_size_mb: 5
  max_age_days: 7
  history_size: 50

bot:
  mode: "server"
  ws_server_path: "/ws/shiro"
  ws_client_url: "ws://localhost:3001"
  access_token: ""
  wait_n: 16
  plugin_prefix: false
  plugin_name: ""

auth:
  jwt_secret: "nyxbot-secret-key"
