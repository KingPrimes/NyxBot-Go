name: Release Build

on:
  workflow_dispatch:
    inputs:
      webui_ref:
        description: "可选：固定 NyxBot-WebUI 的 ref（分支 / 标签 / 提交 SHA）。留空 = 默认分支（最新）；也可用仓库变量 WEBUI_REF 固定（tag 触发的发布同样生效）"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.25.x"
  # 前端源码仓库（独立仓库，构建产物不入本仓库）；CI 拉取后 pnpm build，再由 go:embed 打进二进制
  WEBUI_REPOSITORY: KingPrimes/NyxBot-WebUI
  NODE_VERSION: "22.x"

jobs:
  metadata:
    name: Read Metadata
    runs-on: ubuntu-latest
    outputs:
      executable_name: ${{ steps.meta.outputs.executable_name }}
      product_name: ${{ steps.meta.outputs.product_name }}
      description: ${{ steps.meta.outputs.description }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          META="build/metadata/app.json"
          VERSION=$(jq -r '.version' "$META")
          # 优先使用 git tag 版本号（v1.2.3 → 1.2.3），无 tag（手动触发）回退 app.json
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              VERSION="$TAG_VERSION"
            fi
          fi
          echo "executable_name=$(jq -r '.executableName' "$META")" >> "$GITHUB_OUTPUT"
          echo "product_name=$(jq -r '.productName' "$META")" >> "$GITHUB_OUTPUT"
          echo "description=$(jq -r '.description' "$META")" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ env.WEBUI_REPOSITORY }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WEBUI_REPOSITORY }}
          # 可选固定前端 ref：workflow_dispatch 输入优先，其次仓库变量 WEBUI_REF；两者都为空则取默认分支（最新）
          ref: ${{ inputs.webui_ref || vars.WEBUI_REF }}
          path: NyxBot-WebUI
          persist-credentials: false
      - name: Report frontend revision
        working-directory: NyxBot-WebUI
        shell: bash
        env:
          # 经 env 传入而不是插值进脚本，避免 ref 里的引号/分号被 shell 解释
          REQUESTED_REF: ${{ inputs.webui_ref }}
          REPO_VAR_REF: ${{ vars.WEBUI_REF }}
        run: |
          # 把实际用到的前端提交打进发布日志，便于回溯某个二进制内嵌的是哪版前端
          echo "frontend commit : $(git rev-parse HEAD)"
          echo "frontend subject: $(git log -1 --format='%s')"
          echo "requested ref   : '${REQUESTED_REF}' (repo variable WEBUI_REF='${REPO_VAR_REF}')"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: NyxBot-WebUI/pnpm-lock.yaml
      - name: Build WebUI
        working-directory: NyxBot-WebUI
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          # WebUI 的 move-index-html 插件会把 resources/static/index.html 移到 resources/templates
          test -f resources/templates/index.html
          test -d resources/static/static
          echo "frontend files: $(find resources -type f | wc -l)"
      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: NyxBot-WebUI/resources
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux ${{ matrix.goarch }}
    needs: [metadata, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: resources
      - name: Verify frontend assets
        shell: bash
        run: |
          test -f resources/templates/index.html
          test -d resources/static/static
          echo "frontend files to embed: $(find resources -type f | wc -l)"
      - name: Build binary
        shell: bash
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build \
            -ldflags "-X nyxbot-go/internal/version.Version=${{ needs.metadata.outputs.version }} -X nyxbot-go/internal/version.Commit=${{ github.sha }}" \
            -o "dist/${{ needs.metadata.outputs.executable_name }}-linux-${{ matrix.goarch }}" ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.executable_name }}-linux-${{ matrix.goarch }}
          path: dist/${{ needs.metadata.outputs.executable_name }}-linux-${{ matrix.goarch }}
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.goarch }}
    needs: [metadata, frontend]
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: resources
      - name: Verify frontend assets
        shell: bash
        run: |
          test -f resources/templates/index.html
          test -d resources/static/static
          echo "frontend files to embed: $(find resources -type f | wc -l)"
      - name: Build binary
        shell: bash
        run: |
          GOOS=darwin GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build \
            -ldflags "-X nyxbot-go/internal/version.Version=${{ needs.metadata.outputs.version }} -X nyxbot-go/internal/version.Commit=${{ github.sha }}" \
            -o "dist/${{ needs.metadata.outputs.executable_name }}-darwin-${{ matrix.goarch }}" ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.executable_name }}-darwin-${{ matrix.goarch }}
          path: dist/${{ needs.metadata.outputs.executable_name }}-darwin-${{ matrix.goarch }}
          if-no-files-found: error

  windows:
    name: Windows amd64
    needs: [metadata, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: resources
      - name: Verify frontend assets
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "resources/templates/index.html")) { throw "frontend index.html missing" }
          if (-not (Test-Path -LiteralPath "resources/static/static")) { throw "frontend assets dir missing" }
          $files = @(Get-ChildItem -LiteralPath "resources" -Recurse -File)
          if ($files.Count -lt 2) { throw "frontend assets look empty ($($files.Count) files)" }
          Write-Host "frontend files to embed: $($files.Count)"
      - name: Install goversioninfo
        shell: pwsh
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
      - name: Sync version info
        shell: pwsh
        run: |
          # 用发布版本号精确同步 versioninfo.json（版本/描述统一），不依赖固定版本字符串
          $version = "${{ needs.metadata.outputs.version }}"
          $parts = $version.Split('.')
          $major = [int]$parts[0]
          $minor = if ($parts.Count -gt 1) { [int]$parts[1] } else { 0 }
          $patch = if ($parts.Count -gt 2) { [int]$parts[2] } else { 0 }
          $json = Get-Content -LiteralPath "build/windows/versioninfo.json" -Raw | ConvertFrom-Json
          $json.FixedFileInfo.FileVersion.Major = $major
          $json.FixedFileInfo.FileVersion.Minor = $minor
          $json.FixedFileInfo.FileVersion.Patch = $patch
          $json.FixedFileInfo.ProductVersion.Major = $major
          $json.FixedFileInfo.ProductVersion.Minor = $minor
          $json.FixedFileInfo.ProductVersion.Patch = $patch
          $json.StringFileInfo.FileVersion = $version
          $json.StringFileInfo.ProductVersion = $version
          $json.StringFileInfo.FileDescription = "${{ needs.metadata.outputs.description }}"
          $json | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "build/windows/versioninfo.json" -Encoding UTF8
      - name: Build binary
        shell: pwsh
        run: |
          goversioninfo -icon="build/icons/windows.ico" -o="cmd/server/resource.syso" "build/windows/versioninfo.json"
          $ldflags = "-X nyxbot-go/internal/version.Version=${{ needs.metadata.outputs.version }} -X nyxbot-go/internal/version.Commit=${{ github.sha }}"
          New-Item -ItemType Directory -Path "dist" | Out-Null
          go build -ldflags $ldflags -o "dist/${{ needs.metadata.outputs.executable_name }}.exe" ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.executable_name }}-windows-amd64
          path: dist/${{ needs.metadata.outputs.executable_name }}.exe
          if-no-files-found: error

  docker:
    name: Docker Image
    needs: [metadata, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 复用 linux job 的构建产物（amd64 + arm64），Dockerfile 不再重复编译
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.executable_name }}-linux-amd64
          path: dist/linux/amd64
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.executable_name }}-linux-arm64
          path: dist/linux/arm64
      - name: Prepare binaries
        shell: bash
        run: |
          mv "dist/linux/amd64/${{ needs.metadata.outputs.executable_name }}-linux-amd64" "dist/linux/amd64/NyxBot"
          mv "dist/linux/arm64/${{ needs.metadata.outputs.executable_name }}-linux-arm64" "dist/linux/arm64/NyxBot"
          chmod +x dist/linux/*/NyxBot
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            kingprimes/nyxbot-go
            ghcr.io/${{ github.repository_owner }}/nyxbot-go
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            PRODUCT_NAME=${{ needs.metadata.outputs.product_name }}
            DESCRIPTION=${{ needs.metadata.outputs.description }}
            VCS_REF=${{ github.sha }}
